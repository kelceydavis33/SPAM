name: Update arXiv feed

on:
  schedule:
    # 06:00 UTC every Monday
    - cron: "0 6 * * 1"
  workflow_dispatch:      # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Search arXiv and ADS
        env:
          # Optional. Without it the script searches arXiv abstracts only.
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
        run: python scripts/update_papers.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/arxiv.json
          if git diff --staged --quiet; then
            echo "No new papers."
          else
            git commit -m "Update paper feed"
            git push
          fi
